# U-Net de vasos de retina (FIVES train/val/test + HRF como validación externa)
# Antes: python -m src.data.prepare_retina   (genera data/processed/retina, 1024 px + CLAHE)
experiment: retina_unet_resnet50
seed: 42

data:
  processed_dir: data/processed/retina
  crop: 512                    # recorte de entrenamiento (múltiplo de 32)
  crops_per_image: 2           # recortes por imagen y época
  color_aug: 0.15

model:
  encoder: resnet50            # resnet50 | efficientnetb4 | plain
  weights: imagenet            # imagenet | null
  dropout: 0.1

train:
  batch_size: 4                # RTX 3050 6 GB con mixed precision
  val_batch_size: 1            # validación con la imagen completa (1024)
  epochs: 40
  warmup_epochs: 3             # encoder congelado
  lr: 1.0e-3
  finetune_lr: 2.0e-4
  loss: {bce_weight: 1.0, dice_weight: 1.0}
  early_stopping_patience: 8
  reduce_lr: {factor: 0.5, patience: 3, min_lr: 1.0e-6}
  mixed_precision: true
  steps_per_epoch: null        # null = todo el dataset; un número limita (pruebas)

evaluation:
  tta: true                    # promedio con el volteo horizontal
  max_figures: 12

output:
  dir: models/retina           # best.keras, preprocess.json, historial
  log_dir: logs/retina
  report_dir: reports/retina
