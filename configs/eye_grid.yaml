# Experimento base: detección de ojos (bbox + 6 landmarks por ojo)
experiment: eye_grid_mobilenetv2_224
seed: 42
deterministic: false        # true = enable_op_determinism (más lento)

data:
  raw_dir: data/raw/eyes
  processed_dir: data/processed/eyes
  augmented_dir: data/augmented/eyes
  label_format: auto        # auto | csv | coco | yolo | voc
  image_size: 224           # 224 o 128 (múltiplo de 32)
  max_eyes: 8               # máximo de ojos por imagen que se codifican
  split: {train: 0.70, val: 0.15, test: 0.15}
  cv_folds: 0               # >1 activa K-Fold (recomendado si hay < 500 imágenes)
  cache: true

augmentation:
  enabled: true
  rotate_limit: 15          # grados (±)
  hflip_p: 0.5
  brightness_contrast: 0.2
  translate: 0.05           # fracción del tamaño de imagen
  zoom: 0.10                # ±10 %
  p: 0.8                    # probabilidad de aplicar la transformación geométrica

model:
  backbone: mobilenetv2     # mobilenetv2 | efficientnetb0
  weights: imagenet         # imagenet | null
  head_channels: 128

loss:
  obj_loss: bce             # bce | focal
  pos_weight: 10.0          # peso de celdas positivas (desbalance objeto/fondo)
  obj_weight: 1.0
  box_weight: 5.0
  landmark_weight: 2.0
  huber_delta: 0.1

train:
  batch_size: 16            # 16 cabe en una RTX 3050 6 GB a 224x224
  epochs: 60
  warmup_epochs: 10         # backbone congelado
  unfreeze_last: 50         # capas del backbone que se descongelan después
  lr: 1.0e-3
  finetune_lr: 1.0e-4
  optimizer: adamw          # adamw | adam
  weight_decay: 1.0e-4
  scheduler: cosine         # cosine | plateau
  early_stopping_patience: 10
  mixed_precision: true     # solo se activa si hay GPU
  wandb: false
  wandb_project: eye-retina-ai

inference:
  score_threshold: 0.5
  iou_threshold: 0.4
  max_detections: 10

output:
  models_dir: models/eye_grid
  logs_dir: logs/eye_grid
  reports_dir: reports/eye_grid
